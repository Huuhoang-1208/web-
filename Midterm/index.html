<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>App Xem Phim Online</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a
                href="#"
                class="logo"
            >
                🎬 Movie
            </a>
            <div class="menu">

                <a href="#">
                    Trang Chủ
                </a>

                <a href="#">
                    Thể Loại
                </a>

                <a href="#">
                    Phim Mới
                </a>

                <a href="#">
                    Phim Hot
                </a>

                <a href="#">
                    Tài Khoản
                </a>

            </div>
            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search"
            >

        </div>

    </nav>
    <main class="container">
        <div class="title-section">
            <h1>
                App Xem Phim Online
            </h1>
            <button
                class="add-button"
                onclick="openAddForm()"
            >
                + Thêm Phim
            </button>

        </div>
        <div
            class="row"
            id="movieList"
        >
        </div>
    </main>
    <div
        class="form-overlay"
        id="movieForm"
    >
        <div class="form-box">

            <h2 id="formTitle">
                Thêm Phim
            </h2>
            <input
                type="hidden"
                id="movieId"
            >
            <label>
                Tên phim
            </label>

            <input
                type="text"
                id="movieName"
                placeholder="Nhập tên phim"
            >

            <label>
                Mô tả
            </label>

            <textarea
                id="description"
                placeholder="Nhập mô tả phim"
            ></textarea>
            <label>
                Thời lượng
            </label>
            <input
                type="number"
                id="duration"
                placeholder="Ví dụ: 120"
            >
            <label>
                Năm phát hành
            </label>

            <input
                type="number"
                id="releaseYear"
                placeholder="Ví dụ: 2024"
            >
            <label>
                Giá thuê
            </label>

            <input
                type="number"
                id="rentalPrice"
                placeholder="Ví dụ: 50000"
            >

            <label>
                Link hình ảnh
            </label>

            <input
                type="text"
                id="imageUrl"
                placeholder="https://..."
            >
            <div class="form-buttons">
                <button
                    class="save-button"
                    onclick="saveMovie()"
                >
                    Lưu
                </button>
                <button
                    class="cancel-button"
                    onclick="closeForm()"
                >
                    Hủy
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>

</body>

</html>
