<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Women's Products Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <header class="product-header">
      <h2 class="title">WOMEN'S PRODUCTS</h2>
      <nav class="category-nav">
        <a href="#" class="nav-item active">All</a>
        <a href="#" class="nav-item">Clothings</a>
        <a href="#" class="nav-item">Bags</a>
        <a href="#" class="nav-item">Shoes</a>
        <a href="#" class="nav-item">Watches</a>
        <a href="#" class="nav-item">Googles</a>
      </nav>
    </header>

    <div class="content-grid">
      
      <div class="products-list">
        <div class="product-card">
          <div class="card-image">
            <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=600&q=80" alt="Women Bags">
          </div>
          <div class="card-body">
            <div class="info">
              <h3 class="product-name">Women Bags</h3>
              <div class="price-box">
                <span class="current-price">€100.00</span>
                <span class="old-price">€50.00</span>
              </div>
            </div>
            <button class="btn-add-cart">ADD TO CART</button>
          </div>
        </div>
        <div class="product-card">
          <div class="card-image">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80" alt="Google">
          </div>
          <div class="card-body">
            <div class="info">
              <h3 class="product-name">Google</h3>
              <div class="price-box">
                <span class="current-price">€25.00</span>
              </div>
            </div>
            <button class="btn-add-cart">ADD TO CART</button>
          </div>
        </div>

      </div>

     
      <div class="promo-banner">
        <div class="banner-overlay"></div>
        <img class="banner-img" src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?auto=format&fit=crop&w=800&q=80" alt="For Women">
        <div class="banner-content">
          <h1 class="banner-title">FOR WOMEN</h1>
          <a href="#" class="btn-view-all">VIEW ALL</a>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
