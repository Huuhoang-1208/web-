<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bảng điểm của em</title>

    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS của mình -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container score-box">

      
        <h1>BẢNG ĐIỂM CỦA EM</h1>


     
        <div class="row input-row">

            <div class="col-sm-2">
                <span>Semester1:</span>
            </div>

            <div class="col-sm-10">
                <input
                    type="text"
                    id="text_1"
                    class="form-control"
                >
            </div>

        </div>


        
        <div class="row input-row">

            <div class="col-sm-2">
                <span>Semester2:</span>
            </div>

            <div class="col-sm-10">
                <input
                    type="text"
                    id="text_2"
                    class="form-control"
                >
            </div>

        </div>


      
        <div class="row input-row">

            <div class="col-sm-2">
                <span>Year:</span>
            </div>

            <div class="col-sm-2">

                <select
                    id="select"
                    class="form-select"
                >

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>

                </select>

            </div>

        </div>


    
        <div class="row input-row">

            <div class="col-sm-2">
                <span>Summarise:</span>
            </div>

            <div class="col-sm-10">

                <input
                    type="text"
                    id="result"
                    class="form-control"
                    disabled
                >

            </div>

        </div>


     
        <div class="row">

            <div class="col-sm-12">

                <p id="display"></p>

            </div>

        </div>


        <div class="row button-row">

            <div class="col-sm-4">
            </div>


            <div class="col-sm-2">

                <input
                    type="button"
                    id="ok"
                    value="OK"
                    onclick="myFunction1()"
                >

            </div>


            <div class="col-sm-2">

                <input
                    type="button"
                    id="cancel"
                    value="Cancel"
                    onclick="myFunction2()"
                >

            </div>

        </div>

    </div>


    
    <script src="script.js"></script>

</body>

</html>
